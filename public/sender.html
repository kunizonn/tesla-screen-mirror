<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>送信 - Tesla Screen Mirror</title>
<style>
  :root {
    --bg: #111418; --panel: #1b2027; --line: #2c333d; --text: #e8ebef; --muted: #9aa4b1;
    --accent: #3e8bff; --ok: #34c77b; --warn: #f0b429; --err: #ff5d5d;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 10px; letter-spacing: .04em; }
  .connect { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; align-items: baseline; }
  .connect dt { color: var(--muted); font-size: 13px; }
  .connect dd { margin: 0; word-break: break-all; }
  .code { font-size: 44px; font-weight: 700; letter-spacing: .18em; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .url { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 15px; }
  .hint { color: var(--muted); font-size: 13px; }
  .row { display: grid; grid-template-columns: 130px 1fr 80px; gap: 12px; align-items: center; margin: 10px 0; }
  .row label { color: var(--muted); }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  select, input[type=range] { width: 100%; }
  select { background: #0e1115; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 10px; padding: 12px 20px; cursor: pointer; background: var(--accent); color: #fff; }
  button.stop { background: var(--err); }
  button:disabled { opacity: .5; cursor: default; }
  .status { display: inline-flex; align-items: center; gap: 8px; margin-left: 14px; color: var(--muted); }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--err); }
  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .stat { background: #0e1115; border-radius: 8px; padding: 8px 12px; }
  .stat span { display: block; color: var(--muted); font-size: 12px; }
  .stat b { font-size: 18px; font-variant-numeric: tabular-nums; }
  video { width: 100%; max-height: 300px; background: #000; border-radius: 8px; display: block; }
  .error { color: var(--err); margin-top: 10px; white-space: pre-line; }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr 64px; } .row label { grid-column: 1 / -1; } }
</style>
</head>
<body>
<main>
  <h1>Tesla Screen Mirror — 送信</h1>

  <section class="panel">
    <h2>Teslaでの接続情報</h2>
    <dl class="connect">
      <dt>開くURL</dt>
      <dd><span id="publicUrl" class="url">取得中…</span></dd>
      <dt id="fullUrlLabel" hidden>全画面で開く</dt>
      <dd id="fullUrlRow" hidden><span id="fullUrl" class="url"></span></dd>
      <dt id="lanUrlLabel" hidden>同じWi-Fi・<br>テザリングなら</dt>
      <dd id="lanUrlRow" hidden><span id="lanUrl" class="url"></span></dd>
      <dt>接続コード</dt>
      <dd><span id="code" class="code">----</span></dd>
    </dl>
    <p class="hint" id="urlHint"></p>
  </section>

  <section class="panel">
    <h2>画面共有</h2>
    <button id="toggle">画面共有を開始</button>
    <span class="status"><span id="dot" class="dot"></span><span id="statusText">サーバーに接続中…</span></span>
    <div id="error" class="error"></div>
  </section>

  <section class="panel">
    <h2>画質設定(共有中でも変更できます)</h2>
    <div class="row">
      <label for="mode">転送方式</label>
      <select id="mode">
        <option value="ws">WebSocket中継(どこでもつながる・遅め)</option>
        <option value="webrtc">WebRTC(低遅延・おすすめ)</option>
      </select>
      <output id="modeOut"></output>
    </div>
    <div class="row">
      <label for="resolution">最大解像度</label>
      <select id="resolution">
        <option value="1920x1080">1920 × 1080</option>
        <option value="1600x900">1600 × 900</option>
        <option value="1280x720">1280 × 720</option>
        <option value="1024x576">1024 × 576</option>
        <option value="854x480">854 × 480</option>
        <option value="640x360">640 × 360</option>
      </select>
      <output id="resolutionOut"></output>
    </div>
    <div class="row">
      <label for="fps">フレームレート</label>
      <input id="fps" type="range" min="5" max="30" step="1">
      <output id="fpsOut"></output>
    </div>
    <div class="row">
      <label for="quality" id="qualityLabel">JPEG画質</label>
      <input id="quality" type="range" min="0.3" max="0.95" step="0.05">
      <output id="qualityOut"></output>
    </div>
    <p class="hint">映像がカクつく・遅れる場合は、解像度か画質を下げてください。画面の縦横比は維持され、指定より大きくはなりません。</p>
  </section>

  <section class="panel">
    <h2>送信状況</h2>
    <div class="stats">
      <div class="stat"><span>視聴者</span><b id="sViewers">0</b></div>
      <div class="stat"><span>送信fps</span><b id="sFps">0</b></div>
      <div class="stat"><span>帯域</span><b id="sRate">0 Mbps</b></div>
      <div class="stat"><span id="sSizeLabel">1フレーム</span><b id="sSize">-</b></div>
      <div class="stat"><span>送信解像度</span><b id="sRes">-</b></div>
      <div class="stat"><span>視聴側の遅延</span><b id="sLatency">-</b></div>
      <div class="stat"><span>WebRTC接続</span><b id="sRtc">-</b></div>
    </div>
  </section>

  <section class="panel">
    <h2>プレビュー</h2>
    <video id="preview" muted playsinline></video>
  </section>
</main>
<canvas id="canvas" hidden></canvas>
<script src="common.js"></script>
<script src="sender.js"></script>
</body>
</html>
