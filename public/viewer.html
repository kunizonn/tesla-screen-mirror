<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Tesla Screen Mirror</title>
<style>
  :root { --text: #eef1f4; --muted: #8b95a3; --key: #20252c; --key-active: #323a45; --accent: #3e8bff; --err: #ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--text); overflow: hidden;
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: manipulation; }
  [hidden] { display: none !important; }

  /* ---- 接続コード入力 ---- */
  #entry { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 24px; background: #0b0d10; }
  #entry h1 { margin: 0; font-size: 26px; font-weight: 600; }
  #entry p { margin: 0; color: var(--muted); }
  .digits { display: flex; gap: 14px; }
  .digit { width: 72px; height: 88px; border-radius: 14px; background: var(--key); display: flex; align-items: center; justify-content: center;
    font-size: 48px; font-weight: 700; font-variant-numeric: tabular-nums; border: 2px solid transparent; }
  .digit.current { border-color: var(--accent); }
  .keypad { display: grid; grid-template-columns: repeat(3, 120px); gap: 14px; }
  .keypad button { height: 84px; border: 0; border-radius: 16px; background: var(--key); color: var(--text); font: inherit; font-size: 34px; font-weight: 600; cursor: pointer; }
  .keypad button:active { background: var(--key-active); }
  .keypad .connect { background: var(--accent); font-size: 24px; }
  .keypad .connect:disabled { opacity: .35; }
  #entryMsg { min-height: 1.5em; color: var(--err); }
  @media (max-height: 640px) {
    #entry { gap: 12px; }
    .digit { height: 64px; width: 58px; font-size: 36px; }
    .keypad button { height: 60px; font-size: 28px; }
  }

  /* ---- 視聴 ---- */
  #viewer { position: fixed; inset: 0; background: #000; }
  #screen { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  #stats { position: absolute; top: 10px; right: 12px; padding: 3px 10px; border-radius: 8px; background: rgba(0,0,0,.55);
    color: #cfd6de; font-size: 13px; font-variant-numeric: tabular-nums; pointer-events: none; }
  #banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 18px 28px; border-radius: 14px;
    background: rgba(20,24,30,.85); font-size: 22px; text-align: center; white-space: pre-line; pointer-events: none; }
  #menu { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 16px; padding: 18px;
    background: linear-gradient(transparent, rgba(0,0,0,.85)); }
  #menu button { min-width: 170px; height: 72px; border: 0; border-radius: 16px; background: rgba(40,46,55,.95); color: var(--text);
    font: inherit; font-size: 22px; font-weight: 600; cursor: pointer; }
  #menu button:active { background: var(--key-active); }
</style>
</head>
<body>
<section id="entry">
  <h1>Tesla Screen Mirror</h1>
  <p>PCの送信ページに表示されている接続コードを入力</p>
  <div class="digits" id="digits"></div>
  <div class="keypad" id="keypad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="del" aria-label="1文字消す">⌫</button><button data-k="0">0</button><button data-k="ok" class="connect" disabled>接続</button>
  </div>
  <div id="entryMsg"></div>
</section>

<section id="viewer" hidden>
  <canvas id="screen"></canvas>
  <div id="stats">-- ms · -- fps</div>
  <div id="banner">接続中…</div>
  <div id="menu" hidden>
    <button id="btnFullscreen">全画面</button>
    <button id="btnStats">統計 非表示</button>
    <button id="btnLeave">切断</button>
  </div>
</section>

<script src="common.js"></script>
<script src="viewer.js"></script>
</body>
</html>
